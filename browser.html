<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Crew List</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <link rel="stylesheet" href="styles.css"> <!-- optional CSS file -->
  <style>
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      width: 100%;
      height: 100%;
      position: fixed;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }

    #backButton {
      position: fixed;
      top: 12px;
      left: 12px;
      width: 48px;
      height: 48px;
      background-color: #580FC8;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      -webkit-appearance: none;
      appearance: none;
      box-shadow: 0 2px 8px rgba(88, 15, 200, 0.3);
      padding: 0;
    }

    #backButton:active {
      transform: scale(0.95);
    }

    @media (max-width: 600px) {
      #backButton {
        top: 8px;
        left: 8px;
        width: 44px;
        height: 44px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <!-- HTML Back Button -->
  <button id="backButton">←</button>

  <!-- Link to your p5.js sketch -->
  <script src="sketch.js"></script>
  <script>
    // Back button navigates to index.html
    document.getElementById('backButton').addEventListener('click', () => {
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
