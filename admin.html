<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beetlejuice Crew Admin</title>
  <!-- Use the same styles as index + font from browser page -->
  <link rel="stylesheet" href="stylemap.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body class="admin-page">
  <div class="admin-shell">
    <header class="admin-header">
      <div>
        <div class="admin-title">Crew Admin</div>
        <div class="admin-subtitle">Log a new human into the map</div>
      </div>
      <button type="button" class="admin-back" id="backButton" aria-label="Back to map">
        ←
      </button>
    </header>

    <form id="crewForm" autocomplete="off" enctype="multipart/form-data">
      <div class="field-group">
        <label for="name">Name*</label>
        <input id="name" name="name" required placeholder="Full name" />
      </div>

      <div class="field-group">
        <label for="pictureFile">Picture file</label>
        <input
          id="pictureFile"
          name="pictureFile"
          type="file"
          accept="image/*"
        />
        <div class="hint">
          Image will be saved into <code>assets/thumbs/</code> and linked in the CSV.
        </div>
      </div>

      <div class="field-group">
        <label for="bio">Short bio</label>
        <textarea
          id="bio"
          name="bio"
          placeholder="Small bio about the theatre worker. @instagramhandle"
        ></textarea>
      </div>

      <div class="row">
        <div class="field-group">
          <label for="fn">Function*</label>
          <input
            id="fn"
            name="fn"
            required
            placeholder="e.g. Stage Technician"
          />
        </div>

        <div class="field-group">
          <label for="department">Department*</label>
          <select id="department" name="department" required>
            <option value="">Select…</option>
            <option value="Cast">Cast</option>
            <option value="Orchestra">Orchestra</option>
            <option value="Stage management">Stage management</option>
            <option value="Light">Light</option>
            <option value="Sound">Sound</option>
            <option value="Creative">Creative</option>
            <option value="Media">Media</option>
            <option value="Production">Production</option>
            <option value="Admin">Admin</option>
            <option value="Facilities">Facilities</option>
            <option value="Box office">Box office</option>
            <option value="Choreography">Choreography</option>
            <option value="Management">Management</option>
            <option value="Dresser">Dresser</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="field-group">
        <label for="iconFile">Icon file (optional)</label>
        <input
          id="iconFile"
          name="iconFile"
          type="file"
          accept="image/*"
        />
        <div class="hint">
          If empty, the CSV will use <code>images/icon.png</code>.
        </div>
      </div>

      <div class="actions">
        <div id="status" class="status" aria-live="polite"></div>
        <button type="submit" class="submit-btn">
          Save crew
        </button>
      </div>
    </form>
  </div>

  <script>
    // Same spiral background as browser.html
    let angle = 0;
    let wigglePhase = 0;

    function drawBackgroundSpiral() {
      background("#9bb745");
      angle -= 0.01;
      wigglePhase += 0.05;
      const wiggleScale = 1 + sin(wigglePhase) * 0.05;
      drawSpiral(width / 2, height / 2, angle, wiggleScale);
    }

    function drawSpiral(cx, cy, rotation, scaleVal) {
      push();
      translate(cx, cy);
      rotate(rotation);
      scale(scaleVal);
      fill("rgba(155,183,69,0.2)");
      blendMode(MULTIPLY);
      beginShape();
      noStroke();
      const maxRadius = min(width, height * 2);
      const turns = 5;
      const points = 200;
      for (let i = 0; i <= points; i++) {
        const t = i / points;
        const a = t * turns * TWO_PI;
        const r = t * maxRadius;
        vertex(cos(a) * r, sin(a) * r);
      }
      for (let i = points; i >= 0; i--) {
        const t = i / points;
        const a = t * turns * TWO_PI;
        const r = t * maxRadius * 0.85;
        vertex(cos(a) * r, sin(a) * r);
      }
      endShape(CLOSE);
      blendMode(BLEND);
      pop();
    }

    function setup() {
      const canvas = createCanvas(window.innerWidth, window.innerHeight);
      canvas.position(0, 0);
      canvas.style('z-index', '-1');
      canvas.style('position', 'fixed');
    }

    function draw() {
      drawBackgroundSpiral();
    }

    function windowResized() {
      resizeCanvas(window.innerWidth, window.innerHeight);
    }
  </script>
  <script>
    document.getElementById('backButton').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    const form = document.getElementById('crewForm');
    const statusEl = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = '';
      statusEl.className = 'status';

      const formData = new FormData(form);

      const name = formData.get('name');
      const fn = formData.get('fn');
      const department = formData.get('department');

      if (!name || !fn || !department) {
        statusEl.textContent = 'Please fill all required fields.';
        statusEl.classList.add('status--error');
        return;
      }

      try {
        const res = await fetch('/api/crew', {
          method: 'POST',
          body: formData,
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Request failed');
        }

        statusEl.textContent = 'Crew member added to CSV with image paths.';
        statusEl.classList.add('status--success');
        form.reset();
      } catch (err) {
        console.error(err);
        statusEl.textContent =
          'Could not save. Check the server console for details.';
        statusEl.classList.add('status--error');
      }
    });
  </script>
</body>
</html>
